# webserver 설정 파일. CLI 인자(-p, -r)가 이 값보다 우선한다.
listen 8080
root www
max_body 1048576        # 요청 본문 한도(바이트). 넘으면 413
client_timeout 15       # 클라이언트가 조용한 채로 있을 수 있는 시간(초)
upstream_timeout 5      # 백엔드 응답을 기다리는 시간(초). 넘으면 504
max_conns 10000         # 워커 모드에서는 워커 하나당
workers 1               # 2 이상이면 master + 워커 N개 (nginx 방식). auto는 코어 수

# Reverse Proxy
upstream api 127.0.0.1:9001 127.0.0.1:9002
route /api api
